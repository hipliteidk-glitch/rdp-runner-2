name: Roblox Player test (RDP + Tailscale)

# WHY THIS WORKFLOW EXISTS
# ------------------------
# The Roblox Player ships with Byfron/Hyperion anti-cheat. On an environment it
# rejects it does not fail with a normal error - it terminates itself ~400 ms
# after launch with exit code 0xC0000409 (STATUS_STACK_BUFFER_OVERRUN), writes no
# client log, produces no crash dump and shows no message. Roblox's own position:
#     "We don't officially support server SKUs of Windows."
#
# MEASURED BASELINE - client 0.743.0.7431134 (version-11f155f3450f4c8e)
# ---------------------------------------------------------------------
# The x64 GitHub-hosted Windows images are all Server SKUs, and all are rejected:
#
#   windows-2022     Server 2022 Datacenter 21H2  build 20348.5622  -> 0xC0000409
#   windows-latest   Server 2025 Datacenter 24H2  build 26100.33438 -> 0xC0000409
#
# The old "Server 2022 runs it fine" report does not hold for this build, so the
# 2022-vs-2025 comparison the workflow was written for is dead.
#
# The one hosted image that is *not* a Server SKU is windows-11-arm: GitHub's arm64
# Windows images are "Windows 11 Enterprise" (client SKU, DisplayVersion 25H2, build
# 26200.9457). The x64 Player can only run there under emulation, and that was the
# last untested hypothesis for a hosted runner. Measured 2026-10-17 (run 39052640851):
#
#   windows-11-arm  Windows 11 Enterprise 25H2 arm64  build 26200.9457 -> 0xC0000409
#
# Identical signature to the Server SKUs: the x64 client installs fine (elevated, into
# C:\Program Files\Roblox\Versions\<GUID>), starts, and is killed in ~26 s with no client
# log; the installer reports `InstallerFailedToLaunchClient` / `wait result: 258`.
#
# CONCLUSION: every GitHub-hosted Windows image fails the same way. Hosted runners are a
# dead end in both SKU directions:
#   - x64 hosted images are Server SKUs  -> rejected on SKU.
#   - the only client-SKU image is arm64  -> the x64 Player runs under emulation, and
#     Hyperion still kills it (possibly the emulation, possibly the VM underneath; the
#     two can't be separated from one run).
# So `expect: fail` is correct for *all three* images. This workflow's value from here on
# is regression: it goes red the day any hosted image starts letting the Player live.
# A green gate requires a real x64 Client-SKU machine (self-hosted runner), which is what
# `expect: run` and the self-hosted option are for.
#
# CAUTION - `runner: self-hosted` does not run on GitHub's hardware. It runs this whole
# workflow on *your* machine: it enables RDP, installs Tailscale, and installs the Roblox
# Player there. Only pick it for a box you are willing to have modified, and pair it with
# `expect: run` - the default `expect: fail` will turn the gate red precisely because the
# Player survived, which is the good outcome there.
#
# The `expect` input states the result an image should produce. The run is green
# while the image matches that expectation and red otherwise - i.e. this is a
# regression probe. It turns red the moment reality changes: a client surviving on
# a Server SKU, or a known-good image starting to kill the Player. Either way the
# machine is left up, so you can RDP in and look around.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner image to test'
        type: choice
        options:
          - windows-2022      # Server 2022 x64 - measured 0xC0000409 (server SKU)
          - windows-latest    # Server 2025 x64 - measured 0xC0000409 (server SKU)
          - windows-11-arm    # Windows 11 Enterprise Arm64 - client SKU, measured 0xC0000409 (x64 under emulation)
          - self-hosted       # your own x64 Client-SKU (Windows 10/11) box - the only way to get a run
        default: windows-2022
      expect:
        description: 'Result this image is expected to produce (fail = Hyperion kills the Player)'
        type: choice
        options:
          - fail              # measured baseline on every hosted image
          - run               # the correct expectation for a Client-SKU / self-hosted runner
        default: fail
      keep_alive_minutes:
        description: 'Keep the machine (and RDP) alive for this many minutes'
        type: number
        default: 350
      hostname:
        description: 'Tailscale node name - change it so a test run cannot re-register (and disconnect) another live run'
        type: string
        default: gh-roblox-test

permissions:
  contents: read

jobs:
  roblox-test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show the OS we actually got
        shell: pwsh
        run: |
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $os = "$($cv.ProductName) build $($cv.CurrentBuildNumber).$($cv.UBR)"
          Write-Host "ProductName   : $($cv.ProductName)"
          Write-Host "DisplayVersion: $($cv.DisplayVersion)"
          Write-Host "Build         : $($cv.CurrentBuildNumber).$($cv.UBR)"
          "**OS tested:** $os" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Set up RDP (Enable-RDP.ps1)
        shell: pwsh
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          $params = @{
            User             = 'RDP'
            RecreateUser     = $true
            Administrators   = $true
            Port             = 3389
            SecurityLayer    = 0
            FirewallRuleName = 'RDP-Tailscale'
            RestartService   = $true
            KeepTimeouts     = $true
          }
          if ($env:RDP_PASS) {
            $params.Password = $env:RDP_PASS
            Write-Host 'Using the RDP_PASSWORD secret'
          }
          else {
            $params.GeneratePassword = $true
            Write-Host '::warning::secrets.RDP_PASSWORD is not set - a random password is generated and printed below.'
          }
          ./Enable-RDP.ps1 @params
          Write-Host "RDP user 'RDP' ready, listening on 3389"

      - name: Install Tailscale
        shell: pwsh
        run: |
          # Tailscale's Windows docs say: pick the package for your CPU, and on ARM64
          # use the x86 build. The -arm64.msi is offered but does not work on the arm64
          # runner image - it installs, its service runs, `tailscale up` exits 0, and
          # the node still never leaves NoState. x86 under emulation is the supported
          # path (and it is what the x64 images already use).
          $pkg = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'x86' } else { 'amd64' }
          Write-Host "Installing Tailscale package: tailscale-setup-latest-$pkg.msi"
          $p = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-$pkg.msi" -OutFile $p -UseBasicParsing
          # -PassThru so the exit code is actually checked: an MSI that quietly fails
          # used to be reported as a successful step, and the failure only surfaced
          # later as an unexplained "no Tailscale IP".
          $msi = Start-Process msiexec -ArgumentList "/i", "`"$p`"", "/quiet", "/norestart" -Wait -PassThru
          Write-Host "msiexec exit code: $($msi.ExitCode) (0 = ok, 3010 = reboot needed)"
          if ($msi.ExitCode -ne 0 -and $msi.ExitCode -ne 3010) {
            throw "Tailscale MSI failed with exit code $($msi.ExitCode)"
          }
          # The CLI talks to this service, so wait for it before trying to connect.
          $svc = Get-Service Tailscale -ErrorAction SilentlyContinue
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline -and (-not $svc -or $svc.Status -ne 'Running')) {
            Start-Sleep 3
            $svc = Get-Service Tailscale -ErrorAction SilentlyContinue
          }
          if ($svc) { Write-Host "Tailscale service: $($svc.Status)" }
          else { Write-Host "::warning::the Tailscale MSI did not register a service" }

      - name: Connect Tailscale
        # Best effort: the tunnel must never stop the Player test from running.
        # continue-on-error plus the explicit exit-code reset below guarantee the
        # later steps run even if something here goes wrong.
        continue-on-error: true
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          # RDP reachability is best effort here. The point of this workflow is the
          # Hyperion verdict, so a tunnel that will not come up must not stop the
          # Player test from running - it is reported loudly instead, and the run
          # summary says whether the machine is actually reachable.
          try {
            $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"; if (-not (Test-Path $ts)) { $ts = "$env:ProgramFiles\Tailscale IPN\tailscale.exe" }
            if (-not (Test-Path $ts)) { throw "tailscale.exe not found - the install step did not complete" }
            $svc = Get-Service Tailscale -ErrorAction SilentlyContinue
            Write-Host "Tailscale service: $(if ($svc) { $svc.Status } else { 'not registered' })"
            # Stable default hostname on purpose: a run-id hostname makes the tailnet
            # address change on every run, so a saved mstsc address goes stale
            # immediately. Use the `hostname` input for throwaway runs so they don't
            # take the name (and the connection) from a machine already in use.
            & $ts up --authkey=$env:TS_KEY --hostname='${{ inputs.hostname }}' --accept-routes=false --accept-dns=false --reset
            $upExit = $LASTEXITCODE
            Write-Host "tailscale up exit code: $upExit"

            # Poll for the address: reading it once straight after `up` turned a slow
            # start into a null-reference crash instead of a useful error.
            $ip = $null
            $deadline = (Get-Date).AddSeconds(90)
            while (-not $ip -and (Get-Date) -lt $deadline) {
              $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
              if ($ip) { $ip = $ip.Trim() } else { Start-Sleep 5 }
            }
            if (-not $ip) {
              Write-Host "--- tailscale status ---"
              & $ts status
              Write-Host "--- tailscale service ---"
              Get-Service Tailscale -ErrorAction SilentlyContinue | Format-List Name, Status, StartType | Out-String
              Write-Host "--- tailscaled logs ---"
              Get-ChildItem 'C:\ProgramData\Tailscale',
                            'C:\Windows\System32\config\systemprofile\AppData\Local\Tailscale' -Recurse -Filter '*.log' -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending | Select-Object -First 3 | ForEach-Object {
                  Write-Host "### $($_.FullName)"
                  Get-Content $_.FullName -Tail 30 -ErrorAction SilentlyContinue
                }
              throw "tailscale up exited $upExit and no IPv4 address appeared within 90 s"
            }
            "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
            Write-Host "RDP ready: mstsc /v:$ip"
            "**RDP:** ``mstsc /v:$ip``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          catch {
            Write-Host "::warning::RDP will not be reachable - Tailscale failed: $($_.Exception.Message)"
            "**RDP: not reachable** - Tailscale failed: $($_.Exception.Message)" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

          # The Actions pwsh wrapper finishes with `exit $LASTEXITCODE`, and a native
          # command that failed inside this step (tailscale ip -4 returns non-zero
          # when there is no address) would otherwise leak out as a *step* failure -
          # which is what silently skipped the Player test last time. Nothing here is
          # fatal by design, so clear it.
          $LASTEXITCODE = 0

      - name: Install Roblox Player
        shell: pwsh
        env:
          # The stub returns in seconds and the real install runs in a child
          # process, so the wait has to cover the whole download/assemble phase.
          INSTALL_TIMEOUT_SEC: 600
        run: |
          $installer = "$env:TEMP\RobloxPlayerInstaller.exe"
          Invoke-WebRequest -Uri 'https://setup.rbxcdn.com/RobloxPlayerInstaller.exe' -OutFile $installer -UseBasicParsing
          Write-Host "Downloaded installer ($([math]::Round((Get-Item $installer).Length / 1MB, 1)) MB)"
          # Exit code 7 is normal - the installer hands off to a child process.
          $stub = Start-Process $installer -Wait -PassThru
          Write-Host "Installer exit code: $($stub.ExitCode) (7 = handed off, which is normal)"

          # Where the player lands depends on how the installer ran. Its own log says
          # "Installer runs as administrator" on this runner, and an elevated install
          # goes to C:\Program Files\Roblox\Versions\<version GUID> - *not* to
          # %LOCALAPPDATA%\Roblox\Versions. Probing only LocalAppData reported a
          # perfectly good install as "not found".
          # On arm64 Windows Program Files is redirected for native processes, and an
          # emulated x64 client lands under "C:\Program Files" regardless, so list the
          # literal paths too instead of trusting the env vars alone.
          $roots = @(
            "$env:LOCALAPPDATA\Roblox"
            "$env:ProgramFiles\Roblox"
            "${env:ProgramFiles(x86)}\Roblox"
            'C:\Program Files\Roblox'
            'C:\Program Files (x86)\Roblox'
            'C:\Program Files (ARM)\Roblox'
          ) | Where-Object { $_ } | Select-Object -Unique | Where-Object { Test-Path $_ }

          # The bootstrapper self-updates first and then downloads and unpacks the
          # client packages, so wait for the real install: a healthy install either
          # has an installer process alive or the tree growing. Once it stops doing
          # both it is finished (or has given up), so re-check instead of polling on.
          $deadline = (Get-Date).AddSeconds([int]$env:INSTALL_TIMEOUT_SEC)
          $player = $null
          $lastBytes = -1
          $lastGrowth = Get-Date
          while (-not $player -and (Get-Date) -lt $deadline) {
            $player = Get-ChildItem $roots -Recurse -Filter 'RobloxPlayerBeta.exe' -ErrorAction SilentlyContinue |
                      Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($player) { break }
            $busy = @(Get-Process RobloxPlayerInstaller, RobloxPlayerInstallerBootstrapper, RobloxPlayerLauncher -ErrorAction SilentlyContinue).Count
            $bytes = 0
            foreach ($root in $roots) {
              $sum = (Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue |
                      Measure-Object -Property Length -Sum).Sum
              if ($sum) { $bytes += $sum }
            }
            if ($bytes -ne $lastBytes) { $lastBytes = $bytes; $lastGrowth = Get-Date }
            $idle = [int]((Get-Date) - $lastGrowth).TotalSeconds
            Write-Host ("waiting: {0:mm\:ss} left | installer processes: {1} | {2} MB on disk | idle {3}s" -f
                        ($deadline - (Get-Date)), $busy, [math]::Round($bytes / 1MB, 1), $idle)
            if ($busy -eq 0 -and $idle -ge 90) {
              Write-Host "no installer process and no progress for ${idle}s - the install has given up"
              break
            }
            Start-Sleep 10
          }

          if (-not $player) {
            # Leave the evidence next to the report the always()-upload step reads.
            # Roblox's own installer log is the only place that says *why* it quit.
            Copy-Item "$env:LOCALAPPDATA\Roblox\logs" "$env:GITHUB_WORKSPACE\roblox-logs" -Recurse -Force -ErrorAction SilentlyContinue
            $lines = @(
              "Roblox Player install did not produce RobloxPlayerBeta.exe"
              "Installer exit code  : $($stub.ExitCode)"
              "Waited               : $env:INSTALL_TIMEOUT_SEC s (or until 90 s with no progress)"
              "On disk under roots  : $([math]::Round($lastBytes / 1MB, 1)) MB"
              "Roots searched       : $($roots -join '; ')"
              ""
              "--- %LOCALAPPDATA%\Roblox\logs\RobloxPlayerInstaller_*.log ---"
              (Get-Content "$env:LOCALAPPDATA\Roblox\logs\RobloxPlayerInstaller_*.log" -ErrorAction SilentlyContinue | Out-String)
              ""
              "--- Application event log (Roblox / .NET Runtime) ---"
              (Get-WinEvent -LogName Application -MaxEvents 200 -ErrorAction SilentlyContinue |
                 Where-Object { $_.Message -match 'Roblox|\.NET Runtime' } |
                 Select-Object TimeCreated, Id, ProviderName, LevelDisplayName, Message | Out-String -Width 300)
            )
            foreach ($root in $roots) {
              $lines += "--- $root ---"
              $lines += (Get-ChildItem $root -Recurse -ErrorAction SilentlyContinue |
                           Select-Object FullName, Length, LastWriteTime | Out-String)
            }
            $lines += "--- %TEMP%\Roblox* ---"
            $lines += (Get-ChildItem "$env:TEMP" -Filter 'Roblox*' -ErrorAction SilentlyContinue |
                         Select-Object Name, Length, LastWriteTime | Out-String)
            $lines | Set-Content -LiteralPath "$env:GITHUB_WORKSPACE\roblox-diag.txt"
            throw "RobloxPlayerBeta.exe not found after install (see the roblox-diag artifact)"
          }
          Write-Host "Installed : $($player.FullName)"
          Write-Host "Version   : $($player.VersionInfo.ProductVersion)"
          "PLAYER_EXE=$($player.FullName)" >> $env:GITHUB_ENV

      - name: Verify the Player starts (the Hyperion gate)
        shell: pwsh
        env:
          # What this image is expected to produce - see the header note.
          EXPECTED: ${{ inputs.expect }}
        run: |
          $diag = "$env:GITHUB_WORKSPACE\roblox-diag.txt"
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $logs = "$env:LOCALAPPDATA\Roblox\logs"

          # The installer launches the client itself at the end of the install, so
          # compare PIDs rather than process counts: a leftover process from that
          # launch would otherwise let a dead player look alive.
          $before = @(Get-Process RobloxPlayerBeta -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
          Write-Host "RobloxPlayerBeta already running (from the install): $($before -join ', ')"

          $p = Start-Process $env:PLAYER_EXE -PassThru
          # A rejected environment dies in well under a second; give a working one
          # time to reach its window.
          Start-Sleep -Seconds 25
          $p.Refresh()
          $alive = @(Get-Process RobloxPlayerBeta -ErrorAction SilentlyContinue |
                     Where-Object { $before -notcontains $_.Id })

          $fail = $false
          if (-not $p.HasExited) {
            $verdict = "PASS - Player is running (PID $($p.Id))"
          }
          elseif ($alive.Count -gt 0) {
            # The launcher handed off to a fresh process - still a pass.
            $verdict = "PASS - Player is running (PID $($alive.Id -join ', '))"
          }
          else {
            $fail = $true
            $code = 0
            try { $code = $p.ExitCode } catch {}
            # NB: in PowerShell 0xFFFFFFFF parses as Int32 -1, so a "-band 0xFFFFFFFF"
            # mask is a no-op (it prints 0xFFFFFFFFC0000409). Mask via BitConverter.
            $hex = '0x{0:X8}' -f ([BitConverter]::ToUInt32([BitConverter]::GetBytes([int]$code), 0))
            $verdict = "FAIL - Player exited early with $hex"
            if ($code -eq 0xC0000409) {
              $verdict += ' = STATUS_STACK_BUFFER_OVERRUN / fail-fast, i.e. the Byfron-Hyperion self-terminate'
            }
          }

          # The gate is a probe, not a test of the code: on the hosted Server SKUs
          # the documented baseline *is* a killed player. Compare what happened
          # against what this image is expected to do, so the run is green while the
          # image matches its expectation and red when something actually changed.
          $got = if ($fail) { 'fail' } else { 'run' }
          $expected = if ($env:EXPECTED) { $env:EXPECTED } else { 'fail' }
          $mismatch = $got -ne $expected

          $lines = @()
          $lines += "OS      : $($cv.ProductName) build $($cv.CurrentBuildNumber).$($cv.UBR)"
          $lines += "Player  : $($env:PLAYER_EXE)"
          $lines += "VERDICT : $verdict"
          $lines += "EXPECTED: $expected ($(if ($mismatch) { 'MISMATCH - investigate' } else { 'as documented' }))"
          $lines += ""
          $lines += "--- %LOCALAPPDATA%\Roblox\logs ---"
          $lines += (Get-ChildItem $logs -ErrorAction SilentlyContinue |
                     Select-Object Name, Length, LastWriteTime | Out-String)
          # The client's own log usually says what killed it, so keep the tail.
          $clientLog = Get-ChildItem "$logs\*_last.log", "$logs\*.log" -ErrorAction SilentlyContinue |
                       Where-Object { $_.Name -notlike 'RobloxPlayerInstaller*' } |
                       Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($clientLog) {
            $lines += ""
            $lines += "--- tail of $($clientLog.Name) ---"
            $lines += (Get-Content $clientLog.FullName -Tail 40 -ErrorAction SilentlyContinue | Out-String)
          }
          $lines | Set-Content -LiteralPath $diag
          # keep the logs next to the report for the artifact step
          Copy-Item $logs "$env:GITHUB_WORKSPACE\roblox-logs" -Recurse -Force -ErrorAction SilentlyContinue

          $lines -join [Environment]::NewLine | Write-Host
          $lines | Where-Object { $_ -match '^(OS|VERDICT|EXPECTED)' } |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          if ($mismatch) {
            throw "Roblox Player gate mismatch: expected '$expected' but got '$got'. $verdict"
          }
          Write-Host "Result matches the expected '$expected' for this image."

      - name: Upload diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roblox-diag-${{ inputs.runner }}
          path: |
            roblox-diag.txt
            roblox-logs
          if-no-files-found: ignore

      - name: Keep Alive - RDP available for ${{ inputs.keep_alive_minutes }} minutes
        if: always()
        shell: pwsh
        env:
          KEEP_MIN: ${{ inputs.keep_alive_minutes }}
        run: |
          $min = [Math]::Min([int]$env:KEEP_MIN, 350)
          if ($env:TAILSCALE_IP) {
            Write-Host "RDP: mstsc /v:$env:TAILSCALE_IP  (up for $min minutes)"
          }
          else {
            Write-Host "::warning::no Tailscale address - the machine is NOT reachable over RDP this run"
          }
          Write-Host "Launch the Roblox Player from the Start menu inside the session."
          $end = (Get-Date).AddMinutes($min)
          while ((Get-Date) -lt $end) { Write-Host "Alive $env:TAILSCALE_IP"; Start-Sleep 300 }
